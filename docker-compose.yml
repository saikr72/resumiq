version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: resume_intel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resume_intelligence
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      # Use TCP: during first-time init Postgres only listens on a local socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d resume_intelligence"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-node:
    build:
      context: ./backend-node
    container_name: resume_intel_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/resume_intelligence
      PYTHON_SERVICE_URL: http://service-python:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      service-python:
        condition: service_started

  service-python:
    build:
      context: ./service-python
    container_name: resume_intel_python
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  frontend:
    build:
      context: ./frontend
    container_name: resume_intel_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-node

volumes:
  pgdata:
