version: '3.8'

services:
  # Optional local database, for use instead of Supabase: set COMPOSE_PROFILES=local-db
  postgres:
    profiles: ["local-db"]
    image: ankane/pgvector:v0.5.1
    container_name: resume_intel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: resume_intelligence
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      # Use TCP: during first-time init Postgres only listens on a local socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d resume_intelligence"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend-node:
    build:
      context: ./backend-node
    container_name: resume_intel_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your shell or env file}
      DATABASE_SSL: ${DATABASE_SSL:-}
      DATABASE_CA_CERT: ${DATABASE_CA_CERT:-}
      PYTHON_SERVICE_URL: http://service-python:8000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      NODE_ENV: ${NODE_ENV:-development}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      service-python:
        condition: service_started

  service-python:
    build:
      context: ./service-python
    container_name: resume_intel_python
    # Internal only: the backend reaches it over the Compose network, and it has no login of its own
    expose:
      - "8000"
    environment:
      PORT: 8000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: resume_intel_frontend
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:5000}
    ports:
      - "3000:80"
    depends_on:
      - backend-node

volumes:
  pgdata:
